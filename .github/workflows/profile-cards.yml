name: Profile cards

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - fonts/**
      - assets/**
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install fonttools==4.68.0

      - name: Refresh contribution data
        env:
          # Optional repo secret PROFILE_TOKEN (classic PAT with read:user) also counts
          # private contributions; the built-in token covers public ones.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git push
